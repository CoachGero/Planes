<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prototipo de entrenamiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@1,400;1,500&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js"></script>
<style>
:root{
  --bg:#000000;
  --surface:#131313;
  --surface-2:#1d1d1d;
  --line:#2a2a2a;
  --text:#f5f5f5;
  --muted:#a3a3a3;
  --red:#d91f26;
  --red-text:#ff4d52;
  --font:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --serif:'Lora',Georgia,'Times New Roman',serif;
  color-scheme:dark;
  box-sizing:border-box;
  background:var(--bg);
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%;}
h1,h2,h3,p,ul{margin:0;padding:0;}
ul{list-style:none;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2px solid #fff;outline-offset:2px;}

/* estructura */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:10px max(16px,calc((100% - 520px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px;}
.brand strong{display:block;font-weight:700;font-size:15px;letter-spacing:-.01em;line-height:1.2;}
.brand span{display:block;font-family:var(--serif);font-style:italic;color:var(--muted);font-size:13px;}
.role{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;flex:none;}
.role button{border:0;background:transparent;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:500;color:var(--muted);min-height:36px;}
.role button[aria-pressed="true"]{background:var(--red);color:#fff;font-weight:600;}
main{max-width:520px;margin:0 auto;padding:0 16px 112px;}
.demo{font-size:12px;color:var(--muted);padding:10px 0 0;}

h1{font-size:26px;font-weight:700;line-height:1.15;letter-spacing:-.02em;margin:18px 0 4px;}
h2{font-size:18px;font-weight:600;line-height:1.25;margin:28px 0 4px;}
h3{font-size:16px;font-weight:600;line-height:1.3;}
.sub{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:15px;margin-bottom:16px;}
.muted{color:var(--muted);}
.legend{font-size:12px;color:var(--muted);margin:2px 0 4px;}
.empty{color:var(--muted);padding:24px 0;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:4px;background:var(--red);color:#fff;font-weight:600;padding:10px 16px;min-height:44px;text-decoration:none;}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);}
.btn.small{min-height:36px;padding:6px 12px;font-size:13px;}
.wide{display:flex;width:100%;margin-top:20px;}
.link{background:none;border:0;padding:8px 0;min-height:36px;font-size:13px;text-decoration:underline;color:var(--text);}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto;border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;font-size:13px;min-height:40px;}
.chip[aria-pressed="true"]{background:var(--text);color:#000;border-color:var(--text);font-weight:600;}
.dayh{margin-top:14px;}

/* ejercicios y rondas */
.ex{padding:18px 0;border-bottom:1px solid var(--line);}
.block{border:1px solid var(--line);border-radius:8px;padding:14px;margin:16px 0;}
.block .ex{padding:14px 0;}
.blockh{margin:22px 0 6px;color:var(--accent,inherit);}
.weekblock{border-top:1px dashed var(--line);padding-top:12px;margin-top:12px;}
.weekblock:first-child{border-top:none;padding-top:0;margin-top:4px;}
.weekh{font-weight:600;margin:0 0 2px;}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.cue{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:14px;margin-top:2px;}
.rounds{display:grid;gap:6px;margin-top:12px;}
.rd{display:flex;flex-direction:column;align-items:stretch;text-align:center;border:1px solid var(--line);border-radius:4px;background:var(--surface);padding:6px 3px;min-width:0;}
.rd.done{border-color:var(--red);}
.rd .n{font-size:11px;color:var(--muted);}
.rd .reps{font-weight:600;font-size:14px;}
.rd input{width:100%;min-width:0;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;color:var(--red-text);font-family:var(--font);font-weight:700;font-size:20px;text-align:center;padding:2px 0;margin:2px 0;}
.rd input::placeholder{color:#6b6b6b;font-weight:500;font-size:14px;}
.rd .rir{font-size:11px;color:var(--muted);}
details.obs{margin-top:8px;}
details.obs summary{font-size:13px;min-height:36px;display:flex;align-items:center;cursor:pointer;color:var(--muted);}
textarea,.fld input,.fld select,.sel{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 12px;font-size:16px;color:var(--text);min-height:44px;}
textarea{min-height:76px;resize:vertical;}

/* gráfico */
.chart{margin-top:12px;border:1px solid var(--line);border-radius:6px;padding:12px 8px 6px;background:var(--surface);}
.chart svg{display:block;width:100%;height:auto;}
.delta{margin-top:10px;font-size:14px;}
.delta strong{color:var(--red-text);}

/* registro */
.reg{padding:14px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;}
.reg h3{grid-column:1/-1;font-size:15px;}
.reg .k{font-size:12px;color:var(--muted);}
.reg .v{font-weight:700;font-size:20px;color:var(--red-text);line-height:1.2;}
.reg .v.min{color:var(--text);}
.reg .w{font-size:12px;color:var(--muted);}

/* nutrición */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;}
.tile{background:var(--bg);padding:14px;}
.tile .k{font-size:12px;color:var(--muted);}
.tile .v{font-weight:700;font-size:26px;line-height:1.15;letter-spacing:-.02em;}
.tile .v small{font-size:13px;font-weight:500;color:var(--muted);margin-left:3px;}
.tile .d{font-size:12px;color:var(--muted);}
.scroll{overflow-x:auto;margin-top:8px;}
.tbl{border-collapse:collapse;min-width:460px;width:100%;font-size:13px;}
.tbl th{font-weight:500;color:var(--muted);text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);}
.tbl td{padding:10px;text-align:right;border-bottom:1px solid var(--line);}
.tbl th:first-child,.tbl td:first-child{text-align:left;}
.form{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;margin-top:8px;}
.fld{display:block;margin-bottom:12px;font-size:13px;color:var(--muted);}
.fld input,.fld select{margin-top:4px;}
.fld.full{grid-column:1/-1;}

/* listas */
.list li{border-bottom:1px solid var(--line);}
.row-btn{display:flex;width:100%;justify-content:space-between;align-items:center;gap:12px;background:none;border:0;border-left:3px solid transparent;text-align:left;padding:16px 8px 16px 12px;min-height:64px;}
.row-btn.on{border-left-color:var(--red);}
.rb-main strong{display:block;font-weight:600;}
.rb-main em{font-family:var(--serif);color:var(--muted);font-size:14px;}
.rb-side{text-align:right;font-size:12px;color:var(--muted);flex:none;}
.bar{display:block;width:96px;height:5px;background:var(--surface-2);border-radius:3px;margin:0 0 6px auto;overflow:hidden;}
.bar i{display:block;height:100%;background:var(--red);}
.memo{border:1px solid var(--line);border-left:3px solid var(--red);border-radius:4px;background:var(--surface);padding:10px 12px;margin-top:12px;font-size:13px;}
.memo-h{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600;}
.memo-k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:8px;}
.memo-v{margin-top:2px;max-height:120px;overflow:auto;line-height:1.4;}
.memo-v.alert{color:var(--red-text);font-weight:600;}
.memo-v.empty{color:var(--muted);font-style:italic;}
.wod{border:1px solid var(--line);border-left:3px solid var(--red);border-radius:6px;padding:10px 12px;background:var(--surface);margin:6px 0 10px;}
.wod-h{font-weight:700;font-size:15px;letter-spacing:.02em;}
.wod ol{margin:8px 0 0;padding-left:20px;} .wod li{margin:6px 0;line-height:1.35;}
.wod-m{display:inline-block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-right:2px;}
.wod-k{font-weight:700;color:var(--red-text);} .wod-e,.wod-n{font-size:12px;color:var(--muted);}
.rep{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:12px;margin-top:12px;}
.rep h4{margin:0 0 6px;font-size:14px;}
.rep .d{font-size:12px;color:var(--muted);margin-bottom:8px;}
.rep .up{color:#3ddc84;}
.rep .down{color:var(--red-text);}
.rep ul{margin:4px 0 0;padding-left:18px;font-size:12px;}
.rep li{margin-bottom:4px;}
.who{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:4px;padding:8px 8px 8px 12px;margin-top:14px;font-size:13px;}
.who strong{font-weight:600;}

/* programas */
.prog{padding:18px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:14px;}
.prog p{color:var(--muted);font-size:13px;margin-top:4px;}
.prog .go{margin-top:12px;}
.badge{display:inline-block;font-size:12px;font-weight:600;color:#fff;background:var(--red);border-radius:3px;padding:2px 8px;margin-left:8px;vertical-align:2px;}
.months{margin-top:10px;}
.months button{display:grid;grid-template-columns:64px 1fr;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 0;min-height:44px;font-size:14px;}
.months button span:first-child{color:var(--muted);}
details.pg{padding:18px 0;border-bottom:1px solid var(--line);}
details.pg summary{cursor:pointer;list-style:none;min-height:44px;}
details.pg summary::-webkit-details-marker{display:none;}
details.pg summary p{color:var(--muted);font-size:13px;margin-top:4px;}
.switch{width:52px;height:30px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);position:relative;padding:0;flex:none;}
.switch span{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .15s;}
.switch[aria-checked="true"]{background:var(--red);border-color:var(--red);}
.switch[aria-checked="true"] span{transform:translateX(22px);background:#fff;}

/* editor del entrenador */
.edit{display:block;}
.edit .r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px;}

/* barra inferior */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);}
.tabs-in{max-width:520px;margin:0 auto;display:grid;}
.tab{background:none;border:0;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 0;min-height:58px;}
.tab[aria-current="page"]{color:var(--text);font-weight:600;box-shadow:inset 0 2px 0 var(--red);}

/* hoja inferior y aviso */
.sheet-back{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:40;display:flex;align-items:flex-end;justify-content:center;}
.sheet{background:var(--surface-2);width:100%;max-width:520px;border-radius:12px 12px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:88%;overflow:auto;}
.sheet h2{margin:0 0 8px;}
.sheet p{color:var(--muted);margin-bottom:14px;}
.sheet .btn{width:100%;margin-top:8px;}
.vid{aspect-ratio:16/9;background:#080808;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;margin-bottom:14px;color:var(--muted);text-align:center;padding:12px;font-size:13px;}
.vid.on{display:block;padding:0;overflow:hidden;background:#000;}
.vid iframe,.vid video{display:block;width:100%;height:100%;border:0;background:#000;object-fit:contain;}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom,0px));background:#fff;color:#000;padding:10px 16px;border-radius:999px;font-weight:600;font-size:13px;z-index:50;max-width:90%;text-align:center;}
.toast[hidden]{display:none;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important;}}

/* login */
.auth-screen{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;}
.auth-screen[hidden]{display:none;}
.auth-card{width:100%;max-width:360px;}
.auth-card h1{margin:0 0 4px;}
.auth-card .fld{margin-bottom:14px;}
.auth-error{color:var(--red-text);font-size:13px;min-height:16px;margin-top:6px;}
.app-shell[hidden]{display:none;}
.who-bar{display:flex;align-items:center;gap:10px;}
.who-bar .tag{font-size:12px;color:var(--muted);}
</style>
</head>
<body>
<div id="authScreen" class="auth-screen">
  <div class="auth-card">
    <div class="brand" style="margin-bottom:22px"><strong>PF. Gerónimo Malara</strong><span>Ragnarok Gym</span></div>
    <h1>Ingresá a tu cuenta</h1>
    <p class="sub" style="margin-bottom:18px">Usá el email y la contraseña que te dio tu entrenador.</p>
    <label class="fld">Email<input type="email" id="authEmail" autocomplete="username"></label>
    <label class="fld">Contraseña<input type="password" id="authPass" autocomplete="current-password"></label>
    <button type="button" class="btn wide" id="authSubmit" style="margin-top:4px">Ingresar</button>
    <p class="auth-error" id="authError"></p>
  </div>
</div>
<div id="appShell" class="app-shell" hidden>
<header class="topbar">
  <div class="brand"><strong>PF. Gerónimo Malara</strong><span>Ragnarok Gym</span></div>
  <div class="who-bar" id="whoBar"></div>
</header>
<main id="main"></main>
<nav class="tabs" aria-label="Secciones"><div class="tabs-in" id="tabs"></div></nav>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</div>

<script type="text/html" id="testSrc">
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Test de Movimiento</title>
<style>
  :root{--bg:#000;--surface:#131313;--line:#2a2a2a;--text:#f5f5f5;--muted:#a3a3a3;--red:#d91f26;--red-text:#ff4d52;}
  *{box-sizing:border-box;}
  body{margin:0 auto;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:12px 4px 24px;max-width:520px;font-size:14px;}
  h2{font-size:15px;margin:0 0 8px;}
  p.sub{color:var(--muted);font-size:12px;margin:0 0 12px;}
  .box{border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px;background:var(--surface);}
  input,select{color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px;font-size:16px;width:100%;margin-top:3px;}
  label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:10px;}
  .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .wrap{position:relative;}
  .heatpanel{position:absolute;right:8px;bottom:8px;width:172px;background:rgba(10,10,10,.85);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:6px 7px 7px;z-index:5;transition:width .2s,height .2s;overflow:hidden;}
  .heatpanel.collapsed{width:26px;height:26px;padding:0;}
  .heatpanel.collapsed .heatbody{display:none;}
  .heatcap-top{font-size:6px;letter-spacing:.05em;color:#999;text-align:center;margin-bottom:3px;}
  .figs{display:flex;gap:4px;justify-content:center;}
  .fig{flex:1;min-width:0;}
  .figlbl{font-size:5.5px;letter-spacing:.08em;color:#8a8d92;text-align:center;margin-bottom:1px;transition:color .2s;}
  .fig.dom .figlbl{color:#ffd166;font-weight:700;}
  .figsvg{width:100%;height:auto;display:block;transition:opacity .2s;}
  .figsvg .mu{fill:#555a60;stroke:#16181b;stroke-width:.6;transition:fill .12s;}
  .angline{font-size:7px;color:#fff;font-weight:700;text-align:center;margin-top:3px;min-height:9px;}
  .domline{font-size:6px;color:#ffd166;text-align:center;letter-spacing:.04em;}
  .legend{display:flex;justify-content:space-between;gap:3px;font-size:5.5px;color:#bbb;margin-top:4px;}
  .legend i{display:inline-block;width:8px;height:5px;border-radius:2px;margin-right:2px;vertical-align:middle;}
  .heatbar{position:relative;height:5px;border-radius:3px;margin-top:4px;background:linear-gradient(90deg,hsl(215,80%,42%),hsl(120,80%,42%),hsl(50,80%,42%),hsl(0,80%,42%));}
  .heatbar-dot{position:absolute;top:-2px;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid #111;transform:translateX(-50%);left:0%;transition:left .15s linear;}
  .heatbar-lbl{display:flex;justify-content:space-between;font-size:5.5px;color:#999;margin-top:2px;letter-spacing:.02em;}
  .heatmus{font-size:7px;color:#ddd;margin-top:4px;line-height:1.3;}
  .heatmus strong{color:#ff4d52;display:block;font-size:6px;letter-spacing:.04em;}
  .heatclose{position:absolute;top:2px;right:2px;width:18px;height:18px;border:0;border-radius:4px;background:rgba(255,255,255,.12);color:#fff;font-size:12px;line-height:1;cursor:pointer;z-index:2;}
  .heatcap{font-size:8px;color:#ddd;text-align:center;margin-top:2px;line-height:1.2;}
  video,canvas{width:100%;display:block;border-radius:6px;}
  canvas{position:absolute;top:0;left:0;pointer-events:none;}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
  .stat{border:1px solid var(--line);border-radius:6px;padding:8px;text-align:center;}
  .stat .k{font-size:11px;color:var(--muted);}
  .stat .v{font-weight:700;font-size:20px;color:var(--red-text);}
  button{font:inherit;cursor:pointer;}
  button.act{background:var(--red);color:#fff;border:0;border-radius:4px;padding:10px 14px;font-weight:600;font-size:13px;margin:10px 8px 0 0;}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:4px;padding:10px 14px;font-weight:600;font-size:13px;margin-top:10px;}
  button.x{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:12px;padding:4px 0;}
  .status{font-size:12px;color:var(--muted);margin-top:8px;}
  .scroll{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px;}
  th,td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap;}
  th{color:var(--muted);font-weight:500;}
  tr.best td{color:var(--red-text);font-weight:600;}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
  .kpi{border:1px solid var(--line);border-radius:6px;padding:10px;}
  .kpi .k{font-size:11px;color:var(--muted);}
  .kpi .v{font-weight:700;font-size:20px;color:var(--red-text);}
  .kpi .d{font-size:11px;color:var(--muted);}
  .note{font-size:12px;color:var(--muted);margin-top:10px;}
  details.fold{border:1px solid var(--line);border-radius:6px;margin-top:8px;padding:0 10px;}
  details.fold summary{padding:12px 0;font-weight:600;cursor:pointer;}
  .day{font-size:12px;color:var(--muted);margin:10px 0 4px;}
  .ent{border-top:1px solid var(--line);padding:8px 0;font-size:12px;}
  .warn{color:var(--red-text);}
</style>
</head>
<body>
<p class="sub" id="who">Grabá al alumno de costado (plano sagital), de cuerpo entero y con la cámara quieta. Subí un video con 3 a 5 repeticiones.</p>

<div class="box">
  <label class="f">Ejercicio
    <select id="ejSel"></select></label>

function heatColor(v,fase){
  const hue=(1-v)*215;
  return fase==='Concéntrica'?'hsl('+(hue*0.6).toFixed(0)+',90%,50%)':'hsl('+hue.toFixed(0)+',80%,42%)';
}
const MU_BASE='#555a60';
function paintMuscle(m,color){document.querySelectorAll('.mu[data-m="'+m+'"]').forEach(e=>e.style.fill=color);}
function resetHeatmapColors(){
  document.querySelectorAll('.mu').forEach(e=>e.style.fill='');
  document.querySelectorAll('.fig').forEach(e=>e.classList.remove('dom'));
  ['fig-f','fig-b'].forEach(id=>{const e=$(id);if(e)e.style.opacity='1';});
  const bar=$('heatbarDot');if(bar)bar.style.left='0%';
  ['musPrim','musSec','musAnt'].forEach(id=>{const e=$(id);if(e)e.textContent='—';});
  const al=$('angLive');if(al)al.textContent='—';const dl=$('domLine');if(dl)dl.textContent='—';
}
function updateHeatmap(activeJoints,fase,speed,angles){
  const dd=ejDef();
  resetHeatmapColors();
  let sum=0,n=0;
  activeJoints.forEach(k=>{
    const r=romLive[k];
    const romAct=r?Math.max(0,Math.min(1,(r[1]-r[0])/(REF_MAX[k]||60))):0;
    const spdAct=Math.max(0,Math.min(1,(speed||0)/120));
    sum+=Math.max(romAct,spdAct);n++;
  });
  const act=n?sum/n:0;
  const bar=$('heatbarDot');if(bar)bar.style.left=(act*100).toFixed(0)+'%';
  const uniq=a=>a.filter((v,i)=>a.indexOf(v)===i);
  const prim=uniq((dd&&dd.mus&&dd.mus.length)?dd.mus:[].concat.apply([],activeJoints.map(k=>J2MUS[k]||[])));
  const pSet={};prim.forEach(m=>pSet[m]=1);
  const ant=uniq([].concat.apply([],prim.map(m=>ANTAG[m]||[]))).filter(m=>!pSet[m]);
  const aSet={};ant.forEach(m=>aSet[m]=1);
  const sec=uniq([].concat.apply([],activeJoints.map(k=>J2MUS[k]||[]))).filter(m=>!pSet[m]&&!aSet[m]);
  /* antagonistas (violeta): intensidad menor, crece con la activación */
  ant.forEach(m=>paintMuscle(m,'hsl(268,62%,'+(30+act*22).toFixed(0)+'%)'));
  /* sinergistas (ámbar) */
  sec.forEach(m=>paintMuscle(m,'hsl(36,78%,'+(32+act*20).toFixed(0)+'%)'));
  /* principales: escala térmica azul→rojo */
  prim.forEach(m=>paintMuscle(m,heatColor(Math.max(act,.12),fase)));
  const pEl=$('musPrim'),sEl=$('musSec'),aEl=$('musAnt');
  const lab=a=>a.length?a.map(m=>MUS_LABEL[m]||m).join(' · '):'—';
  if(pEl)pEl.textContent=lab(prim);if(sEl)sEl.textContent=lab(sec);if(aEl)aEl.textContent=lab(ant);
  const al=$('angLive');
  if(al&&angles)al.textContent=activeJoints.map(k=>((JN[k]||k).replace(/ \(.*\)/,''))+' '+(angles[k]!=null?angles[k].toFixed(0)+'°':'--')).join(' · ');
  /* dominancia anterior / posterior */
  const nf=prim.filter(m=>FRONT_M[m]).length,nb=prim.filter(m=>BACK_M[m]).length;
  const dl=$('domLine'),fF=$('fig-f'),fB=$('fig-b');
  let dom='';
  if(nf>nb)dom='f';else if(nb>nf)dom='b';
  if(dl)dl.textContent=dom==='f'?'DOMINANCIA ANTERIOR':dom==='b'?'DOMINANCIA POSTERIOR':'ANTERIOR + POSTERIOR';
  if(dom){const on=dom==='f'?fF:fB,off=dom==='f'?fB:fF;on.parentNode.classList.add('dom');off.style.opacity='.78';}
}

/* ---- filtrado de puntos: mediana de 3 cuadros (quita saltos) + filtro One Euro (quita temblor sin atrasarse en movimientos rápidos) ---- */
const SMOOTH={suave:[0.5,20],medio:[1.0,40],preciso:[2.0,80]};
class OneEuro{
  constructor(){this.x=null;this.dx=0;this.t=null;}
  al(c,dt){const tau=1/(2*Math.PI*c);return 1/(1+tau/dt);}
  f(v,t,minC,beta){
    if(this.x===null||t<=this.t){this.x=v;this.t=t;this.dx=0;return v;}
    const dt=Math.max(1e-3,t-this.t);
    this.dx+=this.al(1,dt)*((v-this.x)/dt-this.dx);
    this.x+=this.al(minC+beta*Math.abs(this.dx),dt)*(v-this.x);
    this.t=t;return this.x;
  }
}
const med3=(a,b,c)=>Math.max(Math.min(a,b),Math.min(Math.max(a,b),c));
function smoothSet(set,t,store,lim){
  const [minC,beta]=SMOOTH[$('suavSel').value]||SMOOTH.medio;
  return set.map((p,i)=>{
    const F=store[i]||(store[i]={x:new OneEuro(),y:new OneEuro(),z:new OneEuro(),hx:[],hy:[],last:null});
    const vis=p.visibility==null?1:p.visibility;
    if(vis<0.35&&F.last)return {x:F.last.x,y:F.last.y,z:F.last.z,visibility:vis,hold:true};
    F.hx.push(p.x);F.hy.push(p.y);if(F.hx.length>3){F.hx.shift();F.hy.shift();}
    let x=F.hx.length===3?med3(F.hx[0],F.hx[1],F.hx[2]):p.x,y=F.hy.length===3?med3(F.hy[0],F.hy[1],F.hy[2]):p.y;
    // descarta "teletransportes": un punto no puede moverse más de 'lim' entre dos cuadros
    if(F.last&&lim){const dx=x-F.last.x,dy=y-F.last.y,dd=Math.hypot(dx,dy);if(dd>lim){x=F.last.x+dx*lim/dd;y=F.last.y+dy*lim/dd;}}
    const o={x:F.x.f(x,t,minC,beta),y:F.y.f(y,t,minC,beta),z:F.z.f(p.z||0,t,minC,beta),visibility:vis};
    F.last=o;return o;
  });
}
const vadd=(a,b)=>a.map((v,i)=>v+b[i]),vsub=(a,b)=>a.map((v,i)=>v-b[i]),vmul=(a,k)=>a.map(v=>v*k),vmid=(a,b)=>a.map((v,i)=>(v+b[i])/2);
const vdist=(a,b)=>Math.hypot(...vsub(a,b));
function angN(a,b,c){const ba=vsub(a,b),bc=vsub(c,b);const d=ba.reduce((t,v,i)=>t+v*bc[i],0),m=Math.hypot(...ba)*Math.hypot(...bc)+1e-9;return Math.acos(Math.max(-1,Math.min(1,d/m)))*180/Math.PI;}
/* inclinación del tronco respecto de la vertical: 0° = tronco vertical (cervical sobre cadera) */
const vertN=(cerv,cad)=>{const v=vsub(cerv,cad),m=Math.hypot(...v)+1e-9;return Math.acos(Math.min(1,Math.abs(v[1])/m))*180/Math.PI;};

/* ---- detección cuadro a cuadro: cabeza, cervical, cadera, rodilla, pie ---- */
let lastT=-1;
function loop(){
  if(!running)return;
  if(video.paused||video.ended||video.currentTime===lastT){if(recCtx&&!video.paused&&!video.ended){recCtx.drawImage(video,0,0,recCanvas.width,recCanvas.height);recCtx.drawImage(canvas,0,0,recCanvas.width,recCanvas.height);}requestAnimationFrame(loop);return;}
  lastT=video.currentTime;
  const res=poseLandmarker.detectForVideo(video,tsNow());
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(res.landmarks&&res.landmarks.length){
    const W=canvas.width,H=canvas.height,tt=video.currentTime;
    const lm=smoothSet(res.landmarks[0],tt,TR.img,0.12);
    const use3d=$('angSel').value==='3d'&&res.worldLandmarks&&res.worldLandmarks.length;
    const wl=use3d?smoothSet(res.worldLandmarks[0],tt,TR.wor,0.35):null;
    const V=i=>lm[i].visibility||0;
    const R=[12,14,16,24,26,28],L=[11,13,15,23,25,27];
    // lado más visible, con histéresis para que no salte de un lado al otro
    const vr=R.reduce((t,i)=>t+V(i),0)/R.length,vl=L.reduce((t,i)=>t+V(i),0)/L.length;
    TR.er=TR.er==null?vr:TR.er*0.9+vr*0.1;TR.el=TR.el==null?vl:TR.el*0.9+vl*0.1;
    const forz=$('ladoSel').value;
    if(forz==='der'||forz==='izq')TR.side=forz;
    else if(!TR.side)TR.side=TR.er>=TR.el?'der':'izq';
    else if(TR.side==='der'&&TR.el>TR.er+0.12)TR.side='izq';
    else if(TR.side==='izq'&&TR.er>TR.el+0.12)TR.side='der';
    const der=TR.side==='der';
    const [ish,iel,iwr,ih,ik,ia,ifo,iey,iea]=der?[12,14,16,24,26,28,32,5,8]:[11,13,15,23,25,27,31,2,7];
    const P=i=>[lm[i].x*W,lm[i].y*H];
    const OTH=i=>i===2?5:i===5?2:i%2?i+1:i-1;
    const mk=(Pf,tag)=>{
      // si el punto del lado elegido se tapa (barra, otro miembro), se usa el del lado opuesto corrido por la distancia que había entre ambos
      const pk=i=>{
        const o=OTH(i),p=Pf(i),key=tag+i,off=TR.off[key];
        if(V(i)>0.7&&V(o)>0.7){const d=vsub(p,Pf(o));TR.off[key]=off?vadd(vmul(off,0.95),vmul(d,0.05)):d;return p;}
        if(V(i)<0.5&&V(o)>0.6&&off)return vadd(Pf(o),off);
        return p;
      };
      const nariz=Pf(0),ojo=pk(iey),oreja=pk(iea),hom=pk(ish),cod=pk(iel),mun=pk(iwr);
      const cerv=vmid(Pf(11),Pf(12)),cad=pk(ih),rod=pk(ik),tob=pk(ia),pie=pk(ifo);
      // MediaPipe no marca frente ni nuca: se estiman a partir de nariz, ojo y oreja
      const frente=vadd(ojo,vmul(vsub(ojo,nariz),0.6));
      const nuca=vadd(vadd(oreja,vmul(vsub(oreja,nariz),0.3)),vmul(vsub(cerv,oreja),0.3));
      return {nariz,ojo,oreja,hom,cod,mun,cerv,cad,rod,tob,pie,frente,nuca,cabeza:$('cabSel').value==='frente'?frente:nuca};
    };
    /* un hueso no cambia de largo: se fija el largo típico de cada segmento (mediana de los cuadros bien vistos) y se corrige lo que se estira o achica de más.
       Se recorre desde la cadera hacia afuera, así el error de un punto no deforma toda la cadena. */
    const SEG=[['cad','rod'],['rod','tob'],['tob','pie'],['cad','cerv'],['cerv','cabeza'],['cerv','hom'],['hom','cod'],['cod','mun']];
    const VIS={cad:V(ih),rod:V(ik),tob:V(ia),pie:V(ifo),cerv:Math.min(V(11),V(12)),cabeza:V(0),hom:V(ish),cod:V(iel),mun:V(iwr)};
    let corr=0;
    const constrain=(gg,tag)=>{
      const S=TR[tag];
      SEG.forEach(([p,c])=>{
        const d=vsub(gg[c],gg[p]),len=Math.hypot(...d),st=S[p+c]||(S[p+c]=[]);
        if(VIS[p]>=0.7&&VIS[c]>=0.7&&len>0){st.push(len);if(st.length>120)st.shift();}
        if(st.length>=10&&len>0){
          const L=st.slice().sort((x,y)=>x-y)[st.length>>1],cl=Math.min(1.12*L,Math.max(0.8*L,len));
          if(cl!==len){gg[c]=vadd(gg[p],vmul(d,cl/len));corr++;}
        }
      });
    };
    const g=mk(P,'i'),g3=wl?mk(i=>[wl[i].x,wl[i].y,wl[i].z],'w'):g;
    constrain(g,'L2');if(wl)constrain(g3,'L3');
    const {nariz,hom,cod,mun,cerv,cad,rod,tob,pie}=g;
    const cabeza=g.cabeza,cabeza3=g3.cabeza;
    const brazo=usaBrazo();
    ctx.strokeStyle='#f5f5f5';ctx.lineWidth=2;ctx.beginPath();
    [cabeza,cerv,cad,rod,tob,pie].forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));
    if(brazo){ctx.moveTo(cerv[0],cerv[1]);ctx.lineTo(hom[0],hom[1]);ctx.lineTo(cod[0],cod[1]);ctx.lineTo(mun[0],mun[1]);}
    ctx.stroke();
    const qc=v=>v>=0.7?'#3ddc84':v>=0.5?'#ffb020':'#ff4d52';
    const vm=(i,j)=>Math.min(V(i),V(j));
    [[cabeza,7,V(0)],[cerv,5,Math.min(V(11),V(12))],[cad,5,V(ih)],[rod,5,V(ik)],[tob,4,V(ia)],[pie,4,V(ifo)]].concat(brazo?[[hom,4,V(ish)],[cod,4,V(iel)],[mun,4,V(iwr)]]:[]).forEach(([q,r,vv])=>{
      ctx.fillStyle=qc(vv);ctx.beginPath();ctx.arc(q[0],q[1],r,0,7);ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,.65)';ctx.lineWidth=1.5;ctx.stroke();});
    ctx.strokeStyle='#f5f5f5';
    const q3=g3;
    const a={rodilla:angN(q3.cad,q3.rod,q3.tob),cadera:angN(q3.cerv,q3.cad,q3.rod),tronco:vertN(q3.cerv,q3.cad),cuello:angN(cabeza3,q3.cerv,q3.cad),codo:angN(q3.hom,q3.cod,q3.mun),hombro:angN(q3.cad,q3.hom,q3.cod),tobillo:angN(q3.rod,q3.tob,q3.pie)};
    ejDef().j.forEach(k=>{const e=$('v-'+k);if(e)e.textContent=a[k].toFixed(0)+'°';});
    const pp={cerv,cad,mun,pie}[ejDef().p];
    // largo de la cadena nariz-cervical-cadera-rodilla-tobillo: no cambia con la postura (≈90% de la estatura)
    const chain=Math.hypot(nariz[0]-cerv[0],nariz[1]-cerv[1])+Math.hypot(cerv[0]-cad[0],cerv[1]-cad[1])+Math.hypot(cad[0]-rod[0],cad[1]-rod[1])+Math.hypot(rod[0]-tob[0],rod[1]-tob[1]);
    dataLog.push({t:video.currentTime,a,pp,span:chain});
    // ---- información sobre el video: ángulos de las articulaciones dominantes, fase, repeticiones y velocidad
    const dd=ejDef(),n=dataLog.length,fs=Math.max(14,Math.round(W/26));
    maxSpan=Math.max(maxSpan,chain);
    const posJ={rodilla:rod,cadera:cad,tronco:cerv,cuello:cerv,codo:cod,hombro:hom,tobillo:tob};
    dd.j.forEach((k,ix)=>{
      const q=posJ[k],prev=ix?posJ[dd.j[0]]:null,cerca=prev&&Math.hypot(prev[0]-q[0],prev[1]-q[1])<fs*2;
      etiqueta(a[k].toFixed(0)+'°',q[0]+fs*0.6,q[1]-fs*0.3+(cerca?fs*1.1:0),fs,ix?'#ffd166':'#fff');
      const r=romLive[k]||(romLive[k]=[a[k],a[k]]);r[0]=Math.min(r[0],a[k]);r[1]=Math.max(r[1],a[k]);
    });
    const k0=Math.max(0,n-5),slope=a[dd.j[0]]-dataLog[k0].a[dd.j[0]],dtk=dataLog[n-1].t-dataLog[k0].t;
    const fase=Math.abs(slope)<2?'Pausa':((dd.d==='ext')===(slope>0)?'Concéntrica':'Excéntrica');
    updateHeatmap(dd.j,fase,dtk>0?Math.abs(slope)/dtk:0,a);
    if(n>10&&n%5===0)liveReps=pares(extremos(dataLog.map(x=>x.a[dd.j[0]]),dataLog.map(x=>x.t),15),dd).length;
    const alt=parseFloat($('altura').value);let vTxt='';
    if(alt&&n>=3&&maxSpan>0){const q0=dataLog[n-3],q1=dataLog[n-1],dt=q1.t-q0.t;
      if(dt>0)vTxt='Vel '+(Math.hypot(q1.pp[0]-q0.pp[0],q1.pp[1]-q0.pp[1])/dt/(maxSpan/(alt*0.9))/100).toFixed(2)+' m/s';}
    // consideraciones: si el modelo no ve bien la articulación dominante, avisar en vez de mostrar números poco confiables
    const idxJ={rodilla:ik,cadera:ih,tronco:ih,cuello:0,codo:iel,hombro:ish,tobillo:ia};
    const visKey=Math.min(V(idxJ[dd.j[0]]),V(idxJ[dd.j[1]]));
    const romTxt='ROM '+JN[dd.j[0]].split(' ')[0]+': '+romLive[dd.j[0]][0].toFixed(0)+'°–'+romLive[dd.j[0]][1].toFixed(0)+'° ('+(romLive[dd.j[0]][1]-romLive[dd.j[0]][0]).toFixed(0)+'°)';
    const hfs=Math.round(fs*0.9),lines=[[fase,fase==='Concéntrica'?'#ff4d52':fase==='Excéntrica'?'#f5f5f5':'#a3a3a3'],['Reps: '+liveReps,'#fff'],[romTxt,'#ffd166']];
    if(vTxt)lines.push([vTxt,'#fff']);
    const calidad=Math.round(([cad,rod,tob].length&&(V(ih)+V(ik)+V(ia)+Math.min(V(11),V(12)))/4)*100);
    TR.corr=(TR.corr||0)+(corr?1:0);TR.frames=(TR.frames||0)+1;
    lines.push(['Seguimiento '+calidad+'% · lado '+(der?'der.':'izq.')+(use3d?' · 3D':'')+(TR.frames>20?' · corregido '+Math.round(100*TR.corr/TR.frames)+'%':''),calidad>=70?'#3ddc84':calidad>=50?'#ffb020':'#ff4d52']);
    if(visKey<0.5)lines.push(['⚠ Se ve poco: acercate o girá la cámara','#ff4d52']);
    ctx.font='bold '+hfs+'px system-ui,sans-serif';const bw=Math.max(hfs*8.6,...lines.map(l=>ctx.measureText(l[0]).width+16));ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(8,8,Math.min(bw,canvas.width-16),lines.length*hfs*1.25+10);
    lines.forEach(([tx,col],i)=>{ctx.font='bold '+hfs+'px system-ui,sans-serif';ctx.fillStyle=col;ctx.fillText(tx,16,8+hfs*1.15*(i+1)+2);});
  }
  if(recCtx){recCtx.drawImage(video,0,0,recCanvas.width,recCanvas.height);recCtx.drawImage(canvas,0,0,recCanvas.width,recCanvas.height);}
  requestAnimationFrame(loop);
}

/* ---- análisis ---- */
const suav=arr=>arr.map((_,i)=>{const s=arr.slice(Math.max(0,i-2),i+3);return s.reduce((a,b)=>a+b,0)/s.length;});
function extremos(v,t,prom){
  const s=suav(v),o=[];
  for(let i=1;i<s.length-1;i++){
    const mx=s[i]>s[i-1]&&s[i]>=s[i+1],mn=s[i]<s[i-1]&&s[i]<=s[i+1];
    if(!mx&&!mn)continue;
    const tp=mx?'max':'min',l=o[o.length-1];
    if(l&&l.tp===tp){if((mx&&s[i]>l.v)||(mn&&s[i]<l.v))o[o.length-1]={i,t:t[i],v:s[i],tp};continue;}
    if(l&&Math.abs(s[i]-l.v)<prom)continue;
    o.push({i,t:t[i],v:s[i],tp});
  }
  // si el video termina en pleno movimiento (ej. justo al terminar la extensión), el último tramo también cuenta
  const l=o[o.length-1],z=s.length-1;
  if(l&&z>l.i&&((l.tp==='min'&&s[z]-l.v>=prom)||(l.tp==='max'&&l.v-s[z]>=prom)))o.push({i:z,t:t[z],v:s[z],tp:l.tp==='min'?'max':'min'});
  const f0=o[0];
  if(f0&&f0.i>0&&((f0.tp==='min'&&s[0]-f0.v>=prom)||(f0.tp==='max'&&f0.v-s[0]>=prom)))o.unshift({i:0,t:t[0],v:s[0],tp:f0.tp==='min'?'max':'min'});
  return o;
}
/* fases: excéntrica (ini→e) y concéntrica (e→nx), según el esfuerzo del ejercicio */
function pares(ext,d){
  const A=d.d==='flex'?'max':'min',B=d.d==='flex'?'min':'max',o=[];
  ext.forEach((e,j)=>{const nx=ext[j+1];if(e.tp===A&&nx&&nx.tp===B)o.push({pv:ext[j-1],e,nx});});
  return o;
}

/* grabación del video analizado (video + esqueleto + ángulos + fase) */
let rec=null,recChunks=[],recBlob=null,recCanvas=null,recCtx=null,recMime='video/webm';
function startRec(){
  rec=null;recBlob=null;recChunks=[];recCanvas=null;recCtx=null;
  try{
    const mt=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));
    if(!mt||!canvas.captureStream)return;
    const sc=Math.min(1,480/canvas.width);
    recCanvas=document.createElement('canvas');recCanvas.width=Math.round(canvas.width*sc);recCanvas.height=Math.round(canvas.height*sc);
    recCtx=recCanvas.getContext('2d');recMime=mt.split(';')[0];
    rec=new MediaRecorder(recCanvas.captureStream(30),{mimeType:mt,videoBitsPerSecond:900000});
    rec.ondataavailable=e=>{if(e.data&&e.data.size)recChunks.push(e.data);};
    rec.start(1000);
  }catch(e){rec=null;recCtx=null;}
}
function stopRec(){
  return new Promise(res=>{
    recCtx=null;
    if(!rec||rec.state==='inactive'){res(recBlob);return;}
    rec.onstop=()=>{recBlob=new Blob(recChunks,{type:recMime});res(recBlob);};
    try{rec.stop();}catch(e){res(recBlob);}
  });
}
const f1=(x,d=2)=>x==null?'--':x.toFixed(d);

function analizar(){
  if(!dataLog.length)return;
  const peso=parseFloat($('pesoC').value),carga=parseFloat($('carga').value)||0,alt=parseFloat($('altura').value);
  const nt=$('notas');
  if(!peso||!alt){$('resultados').style.display='block';$('kpis').innerHTML='';$('tablaReps').querySelector('thead').innerHTML='';$('tablaReps').querySelector('tbody').innerHTML='';
    nt.innerHTML='<span class="warn">Completá peso corporal y altura del alumno para calcular velocidad y potencia, y volvé a tocar “Analizar”.</span>';$('guardarBtn').style.display='none';return;}
  const def=ejDef(),[j1,j2]=def.j,t=dataLog.map(d=>d.t);
  // escala px→cm: la cadena nariz-cervical-cadera-rodilla-tobillo mide ≈ 90% de la estatura (se toma el cuadro más extendido)
  const span=Math.max(...suav(dataLog.map(d=>d.span)));
  const pxCm=span/(alt*0.90);
  const ext=extremos(dataLog.map(d=>d.a[j1]),t,15);
  const xs=suav(dataLog.map(d=>d.pp[0])),ys=suav(dataLog.map(d=>d.pp[1]));
  const vy=xs.map((_,i)=>{const a=Math.max(0,i-1),b=Math.min(xs.length-1,i+1);return b>a?Math.hypot(xs[b]-xs[a],ys[b]-ys[a])/(t[b]-t[a])/pxCm/100:0;}); // m/s (velocidad del punto seguido)
  const masa=def.m==='sis'?peso+carga:carga;
  let reps=[];
  pares(ext,def).forEach(({pv,e,nx})=>{
    const ini=pv?pv.i:0,fin=nx.i;
    let vp=0;for(let k=e.i;k<=fin;k++)if(vy[k]>vp)vp=vy[k];
    const rg=k=>{const v=dataLog.slice(ini,fin+1).map(d=>d.a[k]);return[Math.min(...v),Math.max(...v)];};
    const fa=k=>[dataLog[ini].a[k],dataLog[e.i].a[k],dataLog[fin].a[k]]; // inicio · fin de excéntrica · fin de concéntrica
    reps.push({ang:{[j1]:rg(j1),[j2]:rg(j2)},fases:{[j1]:fa(j1),[j2]:fa(j2)},tempo:[t[e.i]-t[ini],t[fin]-t[e.i]],v:vp,p:masa*9.81*vp});
  });
  const total=reps.length;reps=reps.slice(0,5);reps.forEach((r,i)=>r.n=i+1);
  $('resultados').style.display='block';
  const T=$('tablaReps');
  if(!reps.length){T.querySelector('thead').innerHTML='';T.querySelector('tbody').innerHTML='';$('kpis').innerHTML='';
    nt.innerHTML='<span class="warn">No se detectaron repeticiones completas. Probá con un video de costado, cuerpo entero y movimiento amplio.</span>';$('guardarBtn').style.display='none';return;}
  reps.forEach(r=>{r.rom=r.ang[j1][1]-r.ang[j1][0];});
  const best=reps.reduce((a,b)=>b.v>a.v?b:a),worst=reps.reduce((a,b)=>b.v<a.v?b:a);
  const romMax=reps.reduce((a,b)=>b.rom>a.rom?b:a),romMin=reps.reduce((a,b)=>b.rom<a.rom?b:a);
  const romProm=reps.reduce((s,r)=>s+r.rom,0)/reps.length;
  const perdida=best.v>0?(best.v-worst.v)/best.v*100:0;
  last={ejercicio:ejNombre(),peso,carga,altura:alt,reps,
    res:{vMax:best.v,repMejor:best.n,vMin:worst.v,repPeor:worst.n,pMax:best.p,pMin:worst.p,perdida,romProm,romMax:romMax.rom,romMin:romMin.rom}};
  $('kpis').innerHTML=`
    <div class="kpi"><div class="k">Velocidad máx. (mejor rep)</div><div class="v">${f1(best.v)} m/s</div><div class="d">Repetición ${best.n}</div></div>
    <div class="kpi"><div class="k">Velocidad mín. (peor rep)</div><div class="v">${f1(worst.v)} m/s</div><div class="d">Repetición ${worst.n}</div></div>
    <div class="kpi"><div class="k">Potencia máx. (mejor rep)</div><div class="v">${best.p.toFixed(0)} W</div><div class="d">Repetición ${best.n}</div></div>
    <div class="kpi"><div class="k">Potencia mín. (peor rep)</div><div class="v">${worst.p.toFixed(0)} W</div><div class="d">Repetición ${worst.n}</div></div>
    <div class="kpi"><div class="k">ROM ${JN[j1]} promedio</div><div class="v">${romProm.toFixed(0)}°</div><div class="d">Máx ${romMax.rom.toFixed(0)}° (rep ${romMax.n}) · mín ${romMin.rom.toFixed(0)}° (rep ${romMin.n})</div></div>`;
  const faTxt=f=>f.map(x=>x.toFixed(0)+'°').join(' → ');
  T.querySelector('thead').innerHTML=`<tr><th>Rep</th><th>${JN[j1]} (ROM)</th><th>${JN[j2]}</th><th>Excént. / Concént.</th><th>Vel. pico</th><th>Pot. pico</th></tr>`;
  T.querySelector('tbody').innerHTML=reps.map(r=>`<tr class="${r===best?'best':''}"><td>${r.n}</td><td>${faTxt(r.fases[j1])} <span style="color:var(--muted)">(${r.rom.toFixed(0)}°)</span></td><td>${faTxt(r.fases[j2])}</td><td>${r.tempo[0]>0?r.tempo[0].toFixed(1)+' s':'--'} / ${r.tempo[1].toFixed(1)} s</td><td>${f1(r.v)} m/s</td><td>${r.p.toFixed(0)} W</td></tr>`).join('');
  let msg=`Ángulos por repetición: inicio → fin de la fase excéntrica → fin de la concéntrica, con el ROM (rango de movimiento) de ${JN[j1]} entre paréntesis. Pérdida de velocidad entre la mejor y la peor repetición: ${perdida.toFixed(0)}%. Velocidad medida sobre: ${PN[def.p]}. Potencia estimada = ${def.m==='sis'?'(peso corporal + carga)':'carga'} × 9,81 × velocidad pico.`;
  if(masa<=0)msg+=' <span class="warn">Cargá el peso de la carga para estimar la potencia.</span>';
  if(total>5)msg+=` Se detectaron ${total} repeticiones; se analizaron las primeras 5.`;
  if(total<3)msg+=` <span class="warn">Solo se detectaron ${total}; para comparar mejor lo ideal son 3 a 5.</span>`;
  nt.innerHTML=msg;$('guardarBtn').style.display='inline-block';
}

function filled(c,w,d,e){var a=c.loads[key(w,d,e.id)]||[];var n=0;for(var r=0;r<e.rounds;r++){if(num(a[r]))n++;}return n;}
function migratePlan(c){
  c.plan=(c.plan||[]).map(function(dayList){
    dayList=dayList||[];
    if(!dayList.length)return dayList;
    if(dayList[0]&&dayList[0].exercises)return dayList;

function dayExercises(c,d){var out=[];(c.plan[d]||[]).forEach(function(b){(b.exercises||[]).forEach(function(e){out.push(e);});});return out;}
function repsArr(e,w){
  if(!e.reps[w-1]||!Array.isArray(e.reps[w-1])){var v=e.reps[w-1];e.reps[w-1]=[];if(typeof v==='number'){for(var i=0;i<e.rounds;i++)e.reps[w-1].push(v);}}
  var a=e.reps[w-1];
  while(a.length<e.rounds)a.push(a.length?a[a.length-1]:10);
  return a;
}
function weeksOf(c){
  if(!c.weeksCount)c.weeksCount=4;
  if(c.weeksCount>MAX_WEEKS)c.weeksCount=MAX_WEEKS;
  if(c.weeksCount<1)c.weeksCount=1;
  return c.weeksCount;
}
function rirArr(e,w){
  if(!e.rir[w-1]||!Array.isArray(e.rir[w-1])){var v=e.rir[w-1];e.rir[w-1]=[];if(typeof v==='number'){for(var i=0;i<e.rounds;i++)e.rir[w-1].push(v);}}
  var a=e.rir[w-1];
  while(a.length<e.rounds)a.push(a.length?a[a.length-1]:2);
  return a;
}
function defaultDay(c){
  for(var d=0;d<c.plan.length;d++){
    var list=dayExercises(c,d);
    for(var i=0;i<list.length;i++){if(filled(c,CUR_WEEK,d,list[i])<list[i].rounds)return d;}
  }
  return 0;
}
function weekPct(c,w){
  var t=0,f=0;
  c.plan.forEach(function(blocks,d){dayExercises(c,d).forEach(function(e){t+=e.rounds;f+=filled(c,w,d,e);});});
  return t?Math.round(f/t*100):0;
}
function planPct(c){
  var t=0,f=0,nw=weeksOf(c);
  for(var w=1;w<=nw;w++){c.plan.forEach(function(blocks,d){dayExercises(c,d).forEach(function(e){t+=e.rounds;f+=filled(c,w,d,e);});});}
  return t?Math.round(f/t*100):0;
}
function allEx(c){var out=[];c.plan.forEach(function(blocks,d){blocks.forEach(function(b){(b.exercises||[]).forEach(function(e){out.push({ex:e,d:d,b:b});});});});return out;}
function avgLoad(c,w,d,e){var arr=c.loads[key(w,d,e.id)]||[],s=0,n=0;for(var r=0;r<e.rounds;r++){if(num(arr[r])){s+=parseFloat(String(arr[r]).replace(',','.'));n++;}}return n?s/n:null;}
function buildInforme(c){
  var nw=weeksOf(c),lista=allEx(c),prog=[],obs=[],totC=0,totF=0,detalle=[];
  lista.forEach(function(it){
    var e=it.ex,d=it.d,w0=null,w1=null,v0=null,v1=null;
    for(var w=1;w<=nw;w++){var v=avgLoad(c,w,d,e);if(v!=null){if(w0===null){w0=w;v0=v;}w1=w;v1=v;}}
    for(var r=0;r<e.rounds;r++){totC++;}
    for(var w2=1;w2<=nw;w2++){totF+=filled(c,w2,d,e);}
    if(w0!==null&&w1!==null&&w1>w0)prog.push({nombre:e.name,delta:v1-v0,de:v0,a:v1,semanas:w0+' a '+w1});
    var nk,nv;for(var w3=1;w3<=nw;w3++){nk=key(w3,d,e.id);nv=(c.notes||{})[nk];if(nv&&nv.trim())obs.push({ex:e.name,semana:w3,texto:nv.trim()});}
    var ex=extremes(c,it),rb=repBreakdown(c,it);
    if(ex.mx||rb.length)detalle.push({nombre:e.name,d:d,overallMax:ex.mx,overallMin:ex.mn,porReps:rb});
  });
  totC*=nw;
  prog.sort(function(a,b){return b.delta-a.delta;});
  var mejor=prog.length?prog[0]:null,peor=prog.length>1?prog[prog.length-1]:(prog.length===1?prog[0]:null);
  if(peor===mejor)peor=null;
  return {fecha:new Date().toISOString(),semanas:nw,cumplimiento:totC?Math.round(totF/totC*100):0,mejor:mejor,peor:peor,progresion:prog,observaciones:obs,detalle:detalle};
}

function findEx(c,id,day){
  if(day!=null){
    var blocks=c.plan[day]||[];
    for(var bi=0;bi<blocks.length;bi++){
      var list=blocks[bi].exercises||[];
      for(var i=0;i<list.length;i++){if(list[i].id===id)return {ex:list[i],d:day,b:blocks[bi]};}
    }
  }
  var l=allEx(c);for(var i=0;i<l.length;i++){if(l[i].ex.id===id)return l[i];}return null;
}
function extremes(c,item){
  var mx=null,mn=null;
  for(var w=1;w<=weeksOf(c);w++){
    var arr=c.loads[key(w,item.d,item.ex.id)]||[],rirA=rirArr(item.ex,w);
    for(var r=0;r<item.ex.rounds;r++){
      var n=num(arr[r]);if(n==null)continue;
      var rec={kg:n,w:w,r:r+1,d:item.d,rir:rirA[r]};
      if(!mx||n>mx.kg)mx=rec;
      if(!mn||n<mn.kg)mn=rec;
    }
  }
  return {mx:mx,mn:mn};
}
function repBreakdown(c,item){
  var e=item.ex,d=item.d,nw=weeksOf(c),groups={};
  for(var w=1;w<=nw;w++){
    var repsA=repsArr(e,w),rirA=rirArr(e,w),arr=c.loads[key(w,d,e.id)]||[];
    for(var r=0;r<e.rounds;r++){
      var n=num(arr[r]);if(n==null)continue;
      var rk=String(repsA[r]==null?'':repsA[r]);
      var rec={kg:n,w:w,r:r+1,d:d,rir:rirA[r]};
      if(!groups[rk])groups[rk]={reps:repsA[r],max:rec,min:rec};
      else{if(n>groups[rk].max.kg)groups[rk].max=rec;if(n<groups[rk].min.kg)groups[rk].min=rec;}
    }
  }
  return Object.keys(groups).map(function(k){return groups[k];}).sort(function(a,b){return String(a.reps).localeCompare(String(b.reps),'es',{numeric:true});});
}
function repBreakdownHtml(rb,dayN){
  if(!rb.length)return '<p class="legend">Sin cargas registradas.</p>';
  return '<div class="scroll"><table class="tbl"><thead><tr><th>Reps</th><th>Máx.</th><th>Dónde</th><th>Mín.</th><th>Dónde</th></tr></thead><tbody>'+
    rb.map(function(g){
      var w=function(r){return r?'Sem '+r.w+'·Ses '+((dayN!=null?dayN:r.d)+1)+'·R'+r.r+(r.rir!=null&&r.rir!==''?'·RIR '+r.rir:''):'';};
      return '<tr><td>'+esc(g.reps)+'</td><td>'+fmtN(g.max.kg)+' kg</td><td class="w">'+w(g.max)+'</td><td>'+fmtN(g.min.kg)+' kg</td><td class="w">'+w(g.min)+'</td></tr>';
    }).join('')+'</tbody></table></div>';
}
/* ---------- gráfico ---------- */
function lineChart(labels,vals,unit,desc){
  var W=340,H=190,pl=38,pr=14,pt=22,pb=26;
  var pts=[];
  vals.forEach(function(v,i){if(v!=null)pts.push({i:i,v:v});});
  if(!pts.length)return '<p class="empty">Todavía no hay datos para mostrar.</p>';
  var nums=pts.map(function(p){return p.v;});
  var mn=Math.min.apply(null,nums),mx=Math.max.apply(null,nums);
  if(mn===mx){mn-=1;mx+=1;}
  var pad=(mx-mn)*0.18;mn-=pad;mx+=pad;
  var n=vals.length;
  var x=function(i){return pl+(n===1?0:i*(W-pl-pr)/(n-1));};
  var y=function(v){return pt+(mx-v)*(H-pt-pb)/(mx-mn);};
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(desc)+'">';
  for(var g=0;g<3;g++){
    var gv=mn+(mx-mn)*g/2,gy=y(gv);
    s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+gy+'" y2="'+gy+'" style="stroke:var(--line)" stroke-width="1"/>';
    s+='<text x="'+(pl-6)+'" y="'+(gy+3)+'" text-anchor="end" font-size="10" style="fill:var(--muted)">'+fmtN(gv,gv%1===0?0:1)+'</text>';
  }
  s+='<polyline fill="none" style="stroke:var(--red-text)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="'+pts.map(function(p){return x(p.i)+','+y(p.v);}).join(' ')+'"/>';
  pts.forEach(function(p){
    s+='<circle cx="'+x(p.i)+'" cy="'+y(p.v)+'" r="4" style="fill:var(--bg);stroke:var(--red-text)" stroke-width="2"/>';
    s+='<text x="'+x(p.i)+'" y="'+(y(p.v)-9)+'" text-anchor="middle" font-size="10" font-weight="600" style="fill:var(--text)">'+fmtN(p.v,1)+'</text>';
  });
  labels.forEach(function(l,i){
    s+='<text x="'+x(i)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" style="fill:var(--muted)">'+esc(l)+'</text>';
  });
  return s+'</svg>';
}

function memoCard(c){
  var f=fichaOf(c),br=function(t){return esc(String(t).trim()).replace(/\n/g,'<br>');};
  var les=String(f.lesiones).trim(),hist=String(f.historialLesiones).trim(),obj=String(f.objetivos).trim();
  var hayLes=/^s[ií]/i.test(les)||hist!=='';
  var lesHtml;
  if(hayLes)lesHtml='<div class="memo-v alert">'+(les?br(les)+(hist?'<br>':''):'')+(hist?'<span style="font-weight:400">'+br(hist)+'</span>':'')+'</div>';
  else if(les)lesHtml='<div class="memo-v">'+br(les)+'</div>';
  else lesHtml='<div class="memo-v empty">Sin cargar</div>';
  return '<div class="memo"><div class="memo-h"><span>Resumen de ficha</span><button type="button" class="link" data-act="tab" data-v="ficha">Ver / editar ficha</button></div>'+
    '<div class="memo-k">Lesiones</div>'+lesHtml+
    '<div class="memo-k">Objetivos</div>'+(obj?'<div class="memo-v">'+br(obj)+'</div>':'<div class="memo-v empty">Sin cargar</div>')+'</div>';
}

function scrProg(c){
  var list=allEx(c),archivo=c.archivo||[];
  var head='<h1>Progreso</h1><p class="sub">'+(UI.role==='alumno'?'Tu evolución de cargas, plan a plan.':'Evolución de cargas de '+esc(c.first)+', plan a plan.')+'</p>'+clientBar(c);
  var names={};
  list.forEach(function(x){names[x.ex.name]=true;});
  archivo.forEach(function(inf){(inf.detalle||[]).forEach(function(dt){names[dt.nombre]=true;});});
  var nameList=Object.keys(names);
  if(!nameList.length)return head+'<p class="empty">Todavía no hay ejercicios cargados.</p>';
  var curName=(UI.exName&&names[UI.exName])?UI.exName:nameList[0];
  UI.exName=curName;
  var item=list.filter(function(x){return x.ex.name===curName;})[0]||null;
  var opts=nameList.map(function(n){return '<option value="'+esc(n)+'"'+(n===curName?' selected':'')+'>'+esc(n)+'</option>';}).join('');

  var pts=[],labels=[];
  archivo.forEach(function(inf){
    var dt=(inf.detalle||[]).filter(function(x){return x.nombre===curName;})[0];
    pts.push(dt&&dt.overallMax?dt.overallMax.kg:null);
    labels.push(new Date(inf.fecha).toLocaleDateString('es-AR',{month:'short',year:'2-digit'}));
  });
  var liveMax=item?extremes(c,item).mx:null;
  pts.push(liveMax?liveMax.kg:null);labels.push('Actual');
  var first=null,last=null;
  for(var i=0;i<pts.length;i++){if(pts[i]!=null){if(first==null)first=pts[i];last=pts[i];}}
  var delta=(first!=null&&last!=null)?'<p class="delta">Carga máxima — variación total: <strong>'+(last-first>=0?'+':'')+fmtN(last-first)+' kg</strong> ('+(first?(last-first>=0?'+':'')+Math.round((last-first)/first*100):0)+'%).</p>':'';

  var liveSection=item?
    ('<h2>Detalle del plan actual</h2><p class="sub" style="margin-bottom:4px">Carga máxima y mínima según la cantidad de repeticiones de cada ronda.</p>'+repBreakdownHtml(repBreakdown(c,item),item.d))
    :('<p class="empty">Este ejercicio ya no está en el plan actual'+(UI.role==='trainer'?' de '+esc(c.first):'')+'; abajo tenés su historial.</p>');

  var pastEntries=archivo.slice().reverse().map(function(inf){
    var dt=(inf.detalle||[]).filter(function(x){return x.nombre===curName;})[0];
    if(!dt)return '';
    var titulo=new Date(inf.fecha).toLocaleDateString('es-AR')+' · '+inf.semanas+' semana'+(inf.semanas===1?'':'s');
    return '<details class="fold"><summary>'+esc(titulo)+'</summary>'+repBreakdownHtml(dt.porReps,dt.d)+'</details>';
  }).filter(Boolean).join('');
  var histSection=pastEntries?('<h2 style="margin-top:18px">Historial de este ejercicio</h2>'+pastEntries):'';

  return head+
    '<label class="fld" style="margin-top:14px">Ejercicio<select class="sel" data-sel="exname" style="margin-top:4px">'+opts+'</select></label>'+
    '<div class="chart">'+lineChart(labels,pts,'kg','Carga máxima de '+esc(curName)+' por plan, en kilos')+'</div>'+delta+
    liveSection+histSection;
}

function scrNutri(c){

  var tiles='';

    tiles='<p class="legend" style="margin-top:14px">Última medición: '+dShort(last.date)+(last.nut?', cargada por '+esc(last.nut):'')+'</p><div class="tiles">'+METRICS.map(function(m){

      if(v!=null&&p!=null){var dv=Math.round((v-p)*10)/10;d=(dv>0?'+':'')+fmtN(dv)+' desde la anterior';}

  var chart=rec.length?'<h2>Evolución</h2><label class="fld" style="margin-top:8px">Medida<select class="sel" data-sel="metric" style="margin-top:4px">'+mopts+'</select></label><div class="chart">'+lineChart(rec.map(function(r){return dShort(r.date);}),rec.map(function(r){return r[m.k]==null?null:r[m.k];}),m.u,'Evolución de '+m.l)+'</div>':'';

  }).join('');
  var table=rec.length?'<h2>Historial</h2><div class="scroll"><table class="tbl"><thead><tr><th>Fecha</th><th>Kg</th><th>IMC</th><th>% graso</th><th>% musc.</th><th>Visceral</th><th>Kcal</th></tr></thead><tbody>'+rows+'</tbody></table></div>':'';
  var form='';
  if(UI.role==='trainer'){
    var today=new Date();var iso=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
    form='<h2>Cargar medición</h2><p class="sub" style="margin-bottom:0">Si dejás el IMC vacío, se calcula con la altura de '+esc(c.first)+' ('+c.height+' cm).</p><div class="form">'+
      '<label class="fld">Fecha<input type="date" id="nf-date" value="'+iso+'"></label>'+
      '<label class="fld">Peso (kg)<input type="text" inputmode="decimal" id="nf-kg"></label>'+
      '<label class="fld">IMC<input type="text" inputmode="decimal" id="nf-imc"></label>'+
      '<label class="fld">% graso<input type="text" inputmode="decimal" id="nf-graso"></label>'+
      '<label class="fld">% muscular<input type="text" inputmode="decimal" id="nf-musc"></label>'+
      '<label class="fld">Grasa visceral<input type="text" inputmode="decimal" id="nf-visc"></label>'+
      '<label class="fld">Kcal por día<input type="text" inputmode="numeric" id="nf-kcal"></label>'+
      '<label class="fld">Nutricionista<input type="text" id="nf-nut"></label></div>'+
      '<button type="button" class="btn wide" style="margin-top:0" data-act="save-nutri">Guardar medición</button>';
  }
  return head+tiles+chart+table+form;
}

function pgFmtLine(b){

function loadTestFrame(){
  var f=document.getElementById('testFrame'),s=document.getElementById('testSrc');
  if(f&&s&&!f.getAttribute('srcdoc'))f.srcdoc=s.textContent.split('<\\/script>').join('<'+'/script>');
}

/* ---------- render ---------- */
function tabUrl(id,tab){return location.pathname+location.search+'#c='+encodeURIComponent(id)+'&t='+encodeURIComponent(tab||'vista');}
function syncHash(){
  if(UI.role==='trainer'&&UI.sel){var h='#c='+encodeURIComponent(UI.sel)+'&t='+encodeURIComponent(UI.tab);if(location.hash!==h)history.replaceState(null,'',h);}
}
function render(scrollTop){
  var c=cur();
  syncHash();
  var rb=document.querySelectorAll('[data-role]');
  for(var i=0;i<rb.length;i++){rb[i].setAttribute('aria-pressed',String(rb[i].getAttribute('data-role')===UI.role));}
  var tabs=UI.role==='alumno'?TABS_A:TABS_T;
  if(!tabs.some(function(t){return t[0]===UI.tab;}))UI.tab=tabs[0][0];
  var tb=$('#tabs');
  tb.style.gridTemplateColumns='repeat('+tabs.length+',1fr)';
  tb.innerHTML=tabs.map(function(t){return '<button type="button" class="tab" data-act="tab" data-v="'+t[0]+'"'+(t[0]===UI.tab?' aria-current="page"':'')+'>'+icon(ICON_FOR[t[0]])+'<span>'+t[1]+'</span></button>';}).join('');
  var fn={plan:UI.role==='alumno'?scrTrain:scrEdit,vista:scrVista,prog:scrProg,nutri:scrNutri,progs:scrProgs,alumnos:scrClients,ficha:scrFicha,test:scrTest}[UI.tab];
  $('#main').innerHTML=(UI.tab==='alumnos')?scrClients():(UI.tab==='test')?scrTest():(c?fn(c):'<p class="empty">Agregá un alumno para empezar.</p>');
  var wb=document.getElementById('whoBar');
  if(wb)wb.innerHTML='<span class="who-bar tag">'+(UI.role==='trainer'?'Panel del entrenador':esc(c?c.first:''))+'</span><button type="button" class="btn ghost small" data-act="logout">Salir</button>';
  if(UI.tab==='test')loadTestFrame();
  if(scrollTop)window.scrollTo(0,0);
}

/* ---------- hojas y avisos ---------- */
function closeSheet(){var s=document.getElementById('sheet');if(s)s.remove();}
function openSheet(html){
  closeSheet();
  var d=document.createElement('div');d.className='sheet-back';d.id='sheet';
  d.innerHTML='<div class="sheet" role="dialog" aria-modal="true">'+html+'</div>';
  document.body.appendChild(d);
  var b=d.querySelector('[data-act="close"]');if(b)b.focus();
}
var toastT;
function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true;},2600);}

/* ---------- eventos ---------- */
document.addEventListener('click',function(ev){
  if(ev.target.id==='sheet'){closeSheet();return;}
  var t=ev.target.closest('[data-act]');if(!t)return;
  var a=t.getAttribute('data-act'),c=cur();
  if(a==='tab'){UI.tab=t.getAttribute('data-v');render(true);}
  else if(a==='week'){UI.week=+t.getAttribute('data-v');render();}
  else if(a==='day'){UI.day=+t.getAttribute('data-v');render();}
  else if(a==='pick'){UI.sel=t.getAttribute('data-id');UI.day=defaultDay(cl(UI.sel));UI.exId=null;UI.tab='plan';render(true);}
  else if(a==='newtab'){window.open(tabUrl(t.getAttribute('data-id'),'vista'),'_blank');}
  else if(a==='close'){closeSheet();}
  else if(a==='video'){
    var f=findEx(c,t.getAttribute('data-ex'),UI.day);if(!f)return;
    var u=safeUrl(f.ex.video);
    var emb=u?embedVideo(u):'';
    openSheet('<h2>'+esc(f.ex.name)+'</h2>'+(emb||'<div class="vid">'+(u?'Video cargado por tu entrenador':'Acá se ve el video explicativo del ejercicio')+'</div>')+
      (f.ex.cue?'<p>'+esc(f.ex.cue)+'</p>':'')+
      (u?'<a class="btn'+(emb?' ghost':'')+'" href="'+esc(u)+'" target="_blank" rel="noopener">'+(emb?'Abrir en otra pestaña':'Abrir video')+'</a>':'<p>'+(UI.role==='trainer'?'Todavía no cargaste el video. Pegá el link en la pestaña Plan.':'Tu entrenador todavía no cargó el video de este ejercicio.')+'</p>')+
      '<button type="button" class="btn ghost" data-act="close">Cerrar</button>');
  }
  else if(a==='add-session'){
    if(c.plan.length<MAX_SESSIONS){c.plan.push([]);UI.day=c.plan.length-1;save();render();}
  }
  else if(a==='del-session'){
    if(c.plan.length>1){
      c.plan.splice(UI.day,1);
      UI.day=Math.min(UI.day,c.plan.length-1);
      save();render();
    }
  }
  else if(a==='add-block'){c.plan[UI.day]=c.plan[UI.day]||[];c.plan[UI.day].push({id:'b'+(uid++),name:'Bloque '+(c.plan[UI.day].length+1),exercises:[]});save();render();}
  else if(a==='del-block'){var bid=t.getAttribute('data-block');c.plan[UI.day]=(c.plan[UI.day]||[]).filter(function(b){return b.id!==bid;});save();render();}
  else if(a==='add-ex'){
    var blk=(c.plan[UI.day]||[]).filter(function(b){return b.id===t.getAttribute('data-block');})[0];
    if(!blk)return;
    blk.exercises=blk.exercises||[];
    blk.exercises.push({id:'e'+(uid++),name:'Nuevo ejercicio',rounds:5,reps:[10,10,10,10],rir:[3,2,2,1],cue:'',kg:20,video:''});
    save();render();
  }
  else if(a==='del-ex'){
    var id=t.getAttribute('data-ex');
    (c.plan[UI.day]||[]).forEach(function(b){b.exercises=(b.exercises||[]).filter(function(e){return e.id!==id;});});
    save();render();
  }
  else if(a==='publish'){toast('Plan enviado a '+c.first);}
  else if(a==='archive-plan'){
    if(!confirm('Se va a guardar en "Planes anteriores" la progresión, las observaciones, y el detalle de carga máxima y mínima de cada ejercicio por cantidad de repeticiones (semana, sesión, ronda y RIR). Después se borran los kilos y observaciones cargados para poder empezar un plan nuevo; la estructura de ejercicios (reps/RIR/rondas) queda igual, la podés editar. ¿Continuar?'))return;
    var inf=buildInforme(c);
    c.archivo=c.archivo||[];c.archivo.push(inf);
    c.loads={};c.notes={};
    save();toast('Plan archivado. Ya podés armar el plan nuevo.');render();
  }
  else if(a==='toggle-prog'){
    var pid=t.getAttribute('data-id'),ix=c.unlocked.indexOf(pid);
    if(ix>-1)c.unlocked.splice(ix,1);else c.unlocked.push(pid);
    save();render();
  }
  else if(a==='buy'){
    var p=PROGRAMS.filter(function(x){return x.id===t.getAttribute('data-id');})[0];
    openSheet('<h2>'+esc(p.name)+'</h2><p>Para habilitar este programa escribile a tu entrenador. Cuando confirme el pago, se abre en tu usuario.</p><a class="btn wide" href="'+WA+'" target="_blank" rel="noopener">Escribir por WhatsApp</a><button type="button" class="btn ghost" data-act="close">Cerrar</button>');
  }
  else if(a==='month'){toast('En la versión real se abre el plan del mes '+t.getAttribute('data-v'));}
  else if(a==='logout'){auth.signOut();}
  else if(a==='add-client'){
    openSheet('<h2>Agregar alumno</h2><label class="fld">Nombre y apellido<input type="text" id="nc-name"></label>'+
      '<label class="fld">Email de acceso<input type="email" id="nc-email"></label>'+
      '<label class="fld">Contraseña temporal<input type="text" id="nc-pass" value="'+genTempPass()+'"></label>'+
      '<p class="legend">Compartile el email y la contraseña por WhatsApp para que ingrese.</p>'+
      '<button type="button" class="btn wide" data-act="create-client">Crear usuario</button>'+
      '<button type="button" class="btn ghost wide" data-act="close">Cancelar</button>');
  }
  else if(a==='create-client'){
    var name=document.getElementById('nc-name').value.trim();
    var email=document.getElementById('nc-email').value.trim();
    var pass=document.getElementById('nc-pass').value.trim();
    if(!name||!email||!pass){toast('Completá nombre, email y contraseña');return;}
    t.disabled=true;t.textContent='Creando...';
    secondaryAuth.createUserWithEmailAndPassword(email,pass).then(function(cred){
      var newUid=cred.user.uid;
      var blank={name:name,first:name.split(' ')[0],goal:'',scale:1,height:170,weeksCount:4,plan:[],loads:{},notes:{},nutri:[],unlocked:[],ficha:{}};
      return db.collection('clients').doc(newUid).set({state:JSON.stringify(blank)}).then(function(){return secondaryAuth.signOut();});
    }).then(function(){return loadAllClients();}).then(function(arr){
      S.clients=arr;closeSheet();render(true);toast('Alumno creado. Compartile el email y la contraseña.');
    }).catch(function(err){
      var msg=err&&err.code==='auth/email-already-in-use'?'Ese email ya está en uso':'No se pudo crear: '+(err&&err.message?err.message:'');
      toast(msg);t.disabled=false;t.textContent='Crear usuario';
    });
  }
  else if(a==='save-nutri'){
    var g=function(id){return document.getElementById(id).value;};
    var kg=num(g('nf-kg'));
    if(!kg){toast('Ingresá el peso en kg');return;}
    var imc=num(g('nf-imc'));if(!imc)imc=Math.round(kg/Math.pow(c.height/100,2)*10)/10;
    var date=g('nf-date');if(!date){toast('Elegí una fecha');return;}
    c.nutri.push({date:date,kg:kg,imc:imc,graso:num(g('nf-graso')),musc:num(g('nf-musc')),visc:num(g('nf-visc')),kcal:num(g('nf-kcal')),nut:g('nf-nut').trim()});
    c.nutri.sort(function(x,y){return x.date<y.date?-1:x.date>y.date?1:0;});
    save();render();toast('Medición guardada');
  }
});

document.addEventListener('input',function(ev){
  var t=ev.target,c=cur();
  if(t.hasAttribute('data-load')){
    var k=t.getAttribute('data-k'),arr=c.loads[k]||(c.loads[k]=[]);
    arr[+t.getAttribute('data-r')]=t.value;
    t.parentElement.classList.toggle('done',!!num(t.value));
    var list=dayExercises(c,UI.day),total=0,done=0;
    list.forEach(function(e){total+=e.rounds;done+=filled(c,UI.week,UI.day,e);});
    var cnt=document.getElementById('cnt');if(cnt)cnt.textContent=done+' de '+total;
    save();
  }else if(t.hasAttribute('data-note')){
    c.notes[t.getAttribute('data-k')]=t.value;save();
  }else if(t.hasAttribute('data-fedit')){
    var ff=fichaOf(c);ff[t.getAttribute('data-f')]=t.value;save();
  }else if(t.hasAttribute('data-blockname')){
    var bid2=t.getAttribute('data-block'),blk2=(c.plan[UI.day]||[]).filter(function(b){return b.id===bid2;})[0];
    if(blk2){blk2.name=t.value;save();}
  }else if(t.hasAttribute('data-repfield')){
    var w2=+t.getAttribute('data-w'),f2=findEx(c,t.getAttribute('data-ex'),UI.day);if(!f2)return;
    var r2=+t.getAttribute('data-r');
    var a2=repsArr(f2.ex,w2);
    a2[r2]=t.value;
    save();
  }else if(t.hasAttribute('data-rirfield')){
    var w3=+t.getAttribute('data-w'),f3=findEx(c,t.getAttribute('data-ex'),UI.day);if(!f3)return;
    var r3=+t.getAttribute('data-r');
    var a3=rirArr(f3.ex,w3);
    a3[r3]=t.value;
    save();
  }else if(t.hasAttribute('data-edit')){
    var f=findEx(c,t.getAttribute('data-ex'),UI.day);if(!f)return;
    var field=t.getAttribute('data-field');
    f.ex[field]=t.value;
    save();
  }
});

document.addEventListener('change',function(ev){
  var t=ev.target,s=t.getAttribute&&t.getAttribute('data-sel');if(!s)return;
  if(s==='ex'){UI.exId=t.value;render();}
  else if(s==='exname'){UI.exName=t.value;render();}
  else if(s==='metric'){UI.metric=t.value;render();}
  else if(s==='rounds'){var cc=cur();var f=findEx(cc,t.getAttribute('data-ex'),UI.day);if(f){f.ex.rounds=+t.value;save();render();}}
  else if(s==='weeksCount'){var c2=cur();c2.weeksCount=+t.value;if(UI.week>c2.weeksCount)UI.week=c2.weeksCount;save();render();}
});

document.addEventListener('keydown',function(ev){if(ev.key==='Escape')closeSheet();});

})();
</script>
</body>
